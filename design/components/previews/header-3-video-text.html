<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Detail Department — Header 3 (Video Text)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0B0A09;--ink:#F3F1EC;--bronze:#B8935A;--bronze-lite:#CBAE7E;--muted:#8C867C;--line-soft:rgba(243,241,236,.10)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .sec{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;padding:60px 20px;text-align:center}
  .eyebrow{font-size:.66rem;letter-spacing:.32em;text-transform:uppercase;color:var(--bronze);font-weight:600}

  .videotext{position:relative;width:100%;max-width:1200px;height:min(52vh,420px)}
  .fill{position:absolute;inset:0;
    background:
      linear-gradient(115deg,#3a2f1e 0%,#B8935A 22%,#efe4cf 34%,#8a6c40 46%,#2a2115 60%,#CBAE7E 78%,#4a3a22 100%);
    background-size:280% 280%;
    animation:flow 9s ease-in-out infinite;
    -webkit-mask-size:contain;mask-size:contain;
    -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
    -webkit-mask-position:center;mask-position:center}
  .fill::after{content:"";position:absolute;inset:0;
    background:linear-gradient(90deg,transparent 40%,rgba(255,255,255,.5) 50%,transparent 60%);
    background-size:250% 100%;animation:sweep 5s linear infinite;mix-blend-mode:overlay}
  @keyframes flow{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
  @keyframes sweep{0%{background-position:120% 0}100%{background-position:-120% 0}}
  @media(prefers-reduced-motion:reduce){.fill{animation:none}.fill::after{animation:none}}

  .cap{max-width:52ch}
  .cap p{color:var(--muted);font-weight:300;font-size:1.02rem}
  .note{display:inline-flex;align-items:center;gap:.6em;margin-top:6px;border:1px solid var(--line-soft);
    border-radius:2px;padding:.5em 1em;font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--bronze-lite)}
  .note .d{width:6px;height:6px;border-radius:50%;background:var(--bronze);animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .tag{position:fixed;left:14px;bottom:14px;z-index:99;background:var(--bronze);color:#100f0e;
    font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;padding:7px 12px;font-weight:700;border-radius:2px}
</style>
</head>
<body>
<div class="tag">Header 3 · Video Text · Direção B</div>
<section class="sec">
  <p class="eyebrow">Lisboa · Estúdio de Detalhe Automóvel</p>
  <div class="videotext"><div class="fill" id="fill"></div></div>
  <div class="cap">
    <p>O nome preenchido pelo movimento — o seu vídeo cinematográfico corre dentro das letras.</p>
    <span class="note"><span class="d"></span>Vídeo entra aqui · placeholder animado</span>
  </div>
</section>
<script>
  // Mirrors the VideoText component: build an SVG text mask and apply it.
  const fill=document.getElementById('fill');
  function buildMask(){
    const svg="<svg xmlns='http://www.w3.org/2000/svg' width='100%' height='100%'>"+
      "<text x='50%' y='34%' font-size='17vw' font-weight='800' text-anchor='middle' dominant-baseline='middle' font-family='Sora, sans-serif' letter-spacing='-4'>DETAIL</text>"+
      "<text x='50%' y='74%' font-size='10.6vw' font-weight='800' text-anchor='middle' dominant-baseline='middle' font-family='Sora, sans-serif' letter-spacing='-2'>DEPARTMENT</text>"+
      "</svg>";
    const url='url("data:image/svg+xml,'+encodeURIComponent(svg)+'")';
    fill.style.maskImage=url;fill.style.webkitMaskImage=url;
  }
  buildMask();
  addEventListener('resize',buildMask);
</script>
</body>
</html>
