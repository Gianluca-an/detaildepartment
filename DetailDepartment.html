var MAP = {"home.html":"home","index.html":"home","servicos.html":"servicos","processo.html":"processo","trabalhos.html":"trabalhos","sobre.html":"sobre","contacto.html":"contacto"};
var frame = document.getElementById('stage');
var homeShown = false; /* first home load plays the intro; later ones skip it */
function decode(b64){ return decodeURIComponent(escape(atob(b64))); }
function load(key){
  if(!PAGES[key]) key='home';
  var html = decode(PAGES[key]);
  if(key==='home'){
    if(homeShown){ html = html.replace('<head>', '<head><script>window.__ddSkipIntro=true;<\/script>'); }
    homeShown = true;
  }
  frame.srcdoc = html;
  try{ location.hash = key; }catch(e){}
}
frame.addEventListener('load', function(){
  var l=document.getElementById('loader'); if(l) l.style.display='none';
  try{
    var doc = frame.contentDocument;
    doc.addEventListener('click', function(e){
      var a = e.target.closest && e.target.closest('a');
      if(!a) return;
      var href = a.getAttribute('href')||'';
      if(href.charAt(0)==='#') return;
      var file = href.split('/').pop().split('#')[0].split('?')[0];
      if(MAP[file]){ e.preventDefault(); load(MAP[file]); }
    }, true);
  }catch(err){}
});
var start = (location.hash||'').replace('#','');
load(PAGES[start] ? start : 'home');
</script>
